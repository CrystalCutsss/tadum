<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090b0c" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Tadum</title>
    <script>
      // Тема до загрузки бандла, чтобы не было вспышки. Ключ — как в src/shared/lib/storage.ts.
      (function () {
        try {
          var v = localStorage.getItem('tadum:%BASE_URL%:theme');
          // Витрина Proto задаёт тему по умолчанию (VITE_DEFAULT_THEME, A-056); иначе — системная.
          // Без переменной Vite оставляет плейсхолдер как есть — тогда тема системная.
          var d = '%VITE_DEFAULT_THEME%';
          if (v === null && (d === 'light' || d === 'dark')) v = d;
          var dark = v === 'dark' || ((v === null || v === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Заставка до старта бандла (Кирилл 2026-11-10: белый экран при открытии). React заменяет её первым рендером.
         Цвета — как theme-color выше; токены ещё не загружены. */
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #ffffff; }
      html.dark .boot-splash { background: #090b0c; }
      .boot-splash img { width: 48px; height: 48px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash" aria-busy="true"><img src="/icons/icon.svg" alt="" /></div></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
