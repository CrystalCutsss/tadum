<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090b0c" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Tadum</title>
    <script>
      // Тема до загрузки бандла, чтобы не было вспышки. Ключ — как в src/shared/lib/storage.ts.
      (function () {
        try {
          var v = localStorage.getItem('tadum:%BASE_URL%:theme');
          // Без сохранённого выбора — светлая тема (Кирилл 2026-11-11, A-062); сборка может задать другую (VITE_DEFAULT_THEME).
          // Без переменной Vite оставляет плейсхолдер как есть — тогда светлая.
          var d = '%VITE_DEFAULT_THEME%';
          if (v === null) v = d === 'dark' || d === 'system' ? d : 'light';
          var dark = v === 'dark' || ((v === null || v === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Заставка до старта бандла (Кирилл 2026-11-10: белый экран при открытии). React заменяет её первым рендером.
         Цвета — как theme-color выше; токены ещё не загружены. */
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #ffffff; }
      html.dark .boot-splash { background: #090b0c; }
      /* Логотип экрана входа (tadum. — контуры Geist 700, точка primary) крупно; по нему слева направо
         циклически проходит светлый блик (Кирилл 2026-11-11). Без анимации при reduced motion. */
      .boot-logo { width: 176px; height: auto; overflow: visible; }
      .boot-text { fill: oklch(0.148 0.004 228.8); }
      .boot-dot { fill: oklch(0.488 0.243 264.376); }
      /* Цвет блика задаётся на stop: currentColor у градиента берётся от svg, а не от закрашиваемого контура. */
      .boot-glint { stop-color: #ffffff; }
      html.dark .boot-text { fill: oklch(0.987 0.002 197.1); }
      html.dark .boot-dot { fill: oklch(0.723 0.014 214.4); }
      html.dark .boot-glint { stop-color: oklch(0.56 0.021 213.5); }
      @media (prefers-reduced-motion: reduce) { .boot-sweep { display: none; } }
    </style>
  </head>
