# Превью-воркер tadum (D-063, ADR-003).
# - push в main → `pnpm run deploy:preview` (wrangler deploy): https://tadum.kirillgloba.workers.dev.
# - push в любую другую ветку и открытие PR → превью ветки (A-053): `wrangler preview`, свой адрес
#   https://<ветка>-tadum.kirillgloba.workers.dev; прод не меняется. Адрес — в сводке запуска и комментарием в PR.
# - удаление ветки → превью удаляется.
# Токен Cloudflare живёт только в секретах репозитория CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID — их задаёт Кирилл (D-068);
# без них job пропускает деплой с пояснением.
name: deploy-preview

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    types: [opened, reopened]
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  HUSKY: '0'

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: secrets present
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID не заданы — деплой из CI выключен"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - run: pnpm run deploy:preview
        if: steps.gate.outputs.enabled == 'true'

  branch-preview:
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: secrets present
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID не заданы — превью ветки выключено"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      - name: deploy branch preview
        id: preview
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm run deploy:branch "$BRANCH"
      - name: comment in PR
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            echo "PR для ветки нет — адрес в сводке запуска"
            exit 0
          fi
          body="$(printf 'Превью ветки: %s\n\nКоммит %s. Данные — мок, вход по коду 0000; `?persona=<id>&lang=en` открывает персону без входа.' "$URL" "${SHA:0:7}")"
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  branch-preview-cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.event.ref }}
    steps:
      - name: secrets present
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: ./.github/actions/setup
        if: steps.gate.outputs.enabled == 'true'
      # Превью могло и не создаваться (ветка без push после включения превью) — это не ошибка.
      - run: pnpm run deploy:branch "$BRANCH" --delete
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
