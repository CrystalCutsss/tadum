# Lighthouse CI (мастер-промпт 7a п.3, D-054): на main и по расписанию. v1 — warn, отчёты — артефакт.
name: lighthouse

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: lhci
        run: |
          export CHROME_PATH="$(ls -d /ms-playwright/chromium-*/chrome-linux64/chrome | head -1)"
          pnpm lhci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/reports
          retention-days: 30
