# CI (мастер-промпт 7a п.3). Зеркало — .gitlab-ci.yml: те же jobs и команды.
# Обязательная проверка защиты main — итоговый job `ci` (needs: на все остальные).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Ночной полный прогон: все браузерные проекты, включая desktop-safari / desktop-edge.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  # Браузеры Playwright — из образа (тот же образ в .gitlab-ci.yml).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

  typecheck:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm lint:rtl
      - run: pnpm lint:i18n
      - run: pnpm lint:gitlab-ci
      - run: pnpm deps:check
      - run: pnpm knip
      - run: pnpm jscpd
      - run: pnpm check:events
      - run: pnpm contract:md --check
      - run: pnpm check:contrast
      - run: pnpm check:docs
      - run: pnpm check:claude

  commits:
    if: github.event_name == 'pull_request'
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: commitlint
        run: pnpm exec commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose
      - name: changeset
        run: pnpm exec changeset status --since="origin/${{ github.base_ref }}"

  test:
    needs: install
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # jq нужен хукам Claude Code (scripts/hooks) и их тестам; в образе Playwright его нет.
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends jq
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm storybook:build
      - run: pnpm test:stories

  build:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm check:first-chunk
      - run: pnpm check:demo-excluded
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # Полный набор браузеров — ночью и при ручном запуске (Actions → ci → Run workflow).
      PW_SCHEDULED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # desktop-edge (только по расписанию) — браузер Microsoft Edge, в образе Playwright его нет.
      - run: pnpm exec playwright install --with-deps msedge
        if: env.PW_SCHEDULED == '1'
      # Сценарии v1 + axe (a11y.spec.ts) во всех проектах.
      - run: pnpm test:e2e
      # Скриншоты 360/768/1280 × ar/en × light/dark — артефакты, не эталоны (D-074).
      - run: pnpm screenshots
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: tests/screenshots
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  size:
    needs: build
    runs-on: ubuntu-24.04
    # D-054: в v1 бюджеты — отчёт без блокировки; с v2 убрать continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: pnpm size

  audit:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Бинарник релиза с проверкой sha256 — та же версия и команда, что в .gitlab-ci.yml.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  ci:
    if: always()
    needs: [install, typecheck, lint, commits, test, build, e2e, size, audit, gitleaks]
    runs-on: ubuntu-24.04
    steps:
      - name: all jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # skipped — допустимо (commits только в PR); failure/cancelled — нет.
          echo "$RESULTS" | grep -Eq '"(failure|cancelled)"' && exit 1 || exit 0
